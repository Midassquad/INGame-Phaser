name: Deploy Vite App to GitHub Pages

on:
  push:
    branches:
      - main # Or your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build Project
      # Pass GitHub secrets as environment variables during the build
      run: npm run build
      env:
        VITE_BOARD_ID: ${{ secrets.VITE_BOARD_ID }}

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3 # A popular action for deployment
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist # The output directory for Vite build
