<!doctype html>
<html lang="en">
  <head>
    <title>Chatbox</title>
    <style>
      @font-face {
        font-family: "PixelifySans";
        src: url("../../fonts/PixelifySans-VariableFont_wght.ttf")
          format("truetype");
      }

      .outer-container {
        width: 710px;
        border-radius: 5px;
        border: 5px solid #93abc3;
        box-shadow: 0 0 0 5px #515f6b;
        background-color: #a3703a;
        padding: 30px 30px 15px 30px;
        box-sizing: border-box;
      }
      #chatBox {
        width: 100%;
        height: 500px;
        display: block;
        overflow-y: scroll;
      }

      .chat-outercont {
        display: flex;
        margin-bottom: 20px;
      }

      .chat-outercont.user {
        justify-content: end;
      }

      .chat-outercont.user .chat-container {
        flex-flow: row-reverse;
      }

      .chat-container {
        box-sizing: border-box;
        max-width: 80%;
        display: flex;
        gap: 18px;
        padding-top: 4px;
      }

      .chat-container p {
        font-family: "PixelifySans";
        font-size: 24px;
        color: #a3703a;
        margin: 0;
      }

      .chat-container .chat-thumb {
        min-width: 50px;
        height: 50px;
        background-color: #fff1d3;
        flex-basis: 50px;
        border-radius: 50%;
      }

      .chat-container .chat-msg {
        box-sizing: border-box;
        padding: 8px 20px;
        background-color: #fff1d3;
        border: 5px solid #c58747;
        box-shadow: 0 0 0 4px #6d4b27;
        border-radius: 5px;
      }

      #chatControls {
        box-sizing: border-box;
      }

      #messageForm {
        display: flex;
        gap: 20px;
      }

      #messageForm input {
        flex-basis: 80%;
        border: 0;
        font-size: 24px;
        background-color: #fff1d3;
        border: 5px solid #c58747;
        box-shadow: 0 0 0 4px #6d4b27;
        border-radius: 5px;
        color: #a3703a;
        font-family: "PixelifySans";
        padding: 10px;
      }
      #messageForm input:focus {
        outline: 0;
      }

      #messageForm button {
        flex-basis: 20%;
        background-color: #95aec6;
        border: 5px solid #788d9e;
        box-shadow: 0 0 0 4px #515f6b;
        cursor: pointer;
        color: #515f6b;
        font-family: "PixelifySans";
        font-size: 24px;
        border-radius: 5px;
      }

      #footerChatbox {
        padding-top: 40px;
        text-align: center;
        font-family: "PixelifySans";
        font-size: 30px;
        color: white;
        text-shadow:
          -1px -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          1px 1px 0 #000; /* Multiple shadows to create outline */
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="outer-container">
      <div id="chatBox"></div>
      <div id="chatControls">
        <form action="" id="messageForm">
          <input
            type="text"
            name=""
            value=""
            placeholder="What's on your mind?"
            id="messageInput"
          />
          <button type="submit" id="sendMessage">SEND</button>
        </form>
      </div>
      <div id="footerChatbox">Wanna chat?</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
